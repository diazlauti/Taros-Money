<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#e9ecf4" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1a1f45" media="(prefers-color-scheme: dark)" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Taros Money</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600&display=swap" />
    <!-- Solo el peso "regular" de los íconos, con versión fija. -->
    <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css" />
    <script src="https://accounts.google.com/gsi/client" async defer></script>
  </head>
  <body>
    <div id="root"></div>
    <!-- Copia estática del formulario de lista de espera: Netlify la lee al
         publicar para registrar los campos. El que se usa es ListaEsperaDialog. -->
    <form name="lista-espera" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="text" name="nombre" />
      <input type="email" name="email" />
      <textarea name="mensaje"></textarea>
      <input type="text" name="bot-field" />
    </form>
    <!-- Igual para las sugerencias y errores (SugerenciaDialog). -->
    <form name="sugerencias" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="text" name="tipo" />
      <textarea name="mensaje"></textarea>
      <input type="email" name="email" />
      <input type="text" name="version" />
      <input type="text" name="dispositivo" />
      <textarea name="error"></textarea>
      <input type="text" name="pantalla" />
      <input type="text" name="bot-field" />
    </form>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
