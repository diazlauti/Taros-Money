[build]
  command = "npm run build"
  publish = "dist"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Que el navegador siempre pregunte si hay versión nueva del service worker,
# del HTML y del manifiesto (si no, la app instalada puede quedar vieja). Los
# archivos de /assets/ llevan un código en el nombre que cambia con cada
# versión, así que esos sí se pueden guardar para siempre.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Cabeceras de seguridad. El token de Google vive en localStorage, así que la
# CSP solo deja correr scripts propios y el login de Google, y solo deja
# conectarse a Apps Script y a dolarapi.com (cotizaciones). Si se suma otro
# servicio externo, hay que agregarlo acá o el navegador lo bloquea.
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' https://accounts.google.com/gsi/client; connect-src 'self' https://script.googleapis.com https://dolarapi.com https://accounts.google.com https://oauth2.googleapis.com; frame-src https://accounts.google.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://unpkg.com https://accounts.google.com/gsi/style; font-src 'self' https://fonts.gstatic.com https://unpkg.com; img-src 'self' data: blob:; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# Función que manda los avisos push (la llama el Apps Script).
[functions]
  directory = "netlify/functions"
